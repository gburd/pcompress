name: Hang hunt

# Manual: run one unit test many times on hosted runners, under
# ci/watchdog.sh, to catch the rare test_api hang (clang jobs) with
# backtraces. Each failing run prints gdb's "thread apply all bt".
on:
  workflow_dispatch:
    inputs:
      ref: { description: "commit or tag to test", required: true, default: "master" }
      test: { description: "unit test in buildtmp/", required: true, default: "test_api" }
      rounds: { description: "runs per job", required: true, default: "300" }

permissions:
  contents: read

jobs:
  hunt:
    name: "${{ matrix.runner }} ${{ matrix.cc }} #${{ matrix.shard }}"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        cc: [clang]
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive, ref: "${{ inputs.ref }}" }
      - run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends build-essential clang libomp-dev \
            libssl-dev zlib1g-dev libbz2-dev autoconf automake libtool pkg-config gdb
      - name: Build (as CI does; symbols are not stripped, so backtraces name functions)
        env: { CC: clang, CXX: clang++ }
        run: |
          ./config --disable-wavpack && make -j"$(nproc)"
          make test-unit-build
      - name: Repeat the test
        env: { T: "${{ inputs.test }}", N: "${{ inputs.rounds }}" }
        run: |
          set +e
          h=0
          for i in $(seq 1 "$N"); do
            sh ci/watchdog.sh 120 "buildtmp/$T" > "/tmp/run.log" 2>&1
            rc=$?
            if [ "$rc" != 0 ]; then
              h=$((h+1)); echo "run $i: exit $rc"; tail -n 150 /tmp/run.log
            fi
          done
          echo "runs that failed or hung: $h of $N"
          [ "$h" = 0 ]

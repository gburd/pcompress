# GitHub Actions CI for pcompress.
#
# Every job runs the same recipe as the Codeberg CI: ci/build-test.sh.
# Linux (glibc, gcc + clang, x86_64 + arm64), macOS (Apple Silicon + Intel),
# Windows (MSYS2, x86_64 + aarch64), sanitizers, and the Nix package build
# (which runs the test suite too).

name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: "Linux ${{ matrix.arch }} / ${{ matrix.cc }}${{ matrix.opts && format(' {0}', matrix.opts) || '' }}"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: x86_64, cc: gcc, cxx: g++ }
          - { runner: ubuntu-24.04, arch: x86_64, cc: clang, cxx: clang++ }
          - { runner: ubuntu-22.04, arch: x86_64, cc: gcc, cxx: g++ }
          - { runner: ubuntu-24.04-arm, arch: arm64, cc: gcc, cxx: g++ }
          - { runner: ubuntu-24.04-arm, arch: arm64, cc: clang, cxx: clang++ }
          - { runner: ubuntu-24.04, arch: x86_64, cc: gcc, cxx: g++, opts: --enable-lto }
          - { runner: ubuntu-24.04, arch: x86_64, cc: clang, cxx: clang++, opts: --enable-lto }
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - name: Dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends \
            build-essential clang libomp-dev libssl-dev zlib1g-dev libbz2-dev \
            autoconf automake libtool pkg-config yasm gdb lld
      - name: Build and test
        env: { CC: "${{ matrix.cc }}", CXX: "${{ matrix.cxx }}" }
        run: sh ci/build-test.sh full ${{ matrix.opts }}

  dist:
    name: "Release tarball"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - run: sudo apt-get install -yq autoconf automake libtool
      - run: sh ci/make-dist.sh HEAD .
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: pcompress-HEAD.tar.gz }

  rpm:
    # RPM family, from the release tarball (as packagers build it). RHEL 9's
    # autoconf 2.69 is older than libarchive 3.8 wants; the tarball ships
    # configure, so no autotools are installed here.
    name: "RPM ${{ matrix.image }} ${{ matrix.arch }}"
    needs: dist
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    container: { image: "${{ matrix.image }}" }
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: x86_64, image: "fedora:latest" }
          - { runner: ubuntu-24.04-arm, arch: arm64, image: "fedora:latest" }
          - { runner: ubuntu-24.04, arch: x86_64, image: "rockylinux:9" }
          - { runner: ubuntu-24.04-arm, arch: arm64, image: "rockylinux:9" }
    steps:
      - name: Dependencies
        run: |
          dnf -y install gcc gcc-c++ make libtool pkgconf-pkg-config openssl-devel \
            zlib-devel bzip2-devel perl which diffutils findutils file patch tar gzip
      - uses: actions/download-artifact@v4
        with: { name: dist }
      - name: Build and test
        run: |
          tar xzf pcompress-HEAD.tar.gz && cd pcompress-HEAD
          sh ci/build-test.sh full

  packages:
    # The distribution recipes (packaging/) and the static binary, built from
    # the release tarball as the release workflow does, so they do not rot.
    name: "Packages: ${{ matrix.kind }}"
    needs: dist
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    container: { image: "${{ matrix.image }}" }
    strategy:
      fail-fast: false
      matrix:
        include:
          - { kind: rpm, image: "fedora:latest" }
          - { kind: deb, image: "debian:stable" }
          - { kind: static, image: "alpine:latest" }
    steps:
      - name: Dependencies
        run: |
          case ${{ matrix.kind }} in
          rpm) dnf -y install rpm-build gcc gcc-c++ make openssl-devel zlib-devel bzip2-devel \
                 perl which diffutils findutils file patch tar gzip ;;
          deb) apt-get update -q && DEBIAN_FRONTEND=noninteractive apt-get install -yq \
                 --no-install-recommends build-essential debhelper libssl-dev zlib1g-dev \
                 libbz2-dev perl file patch ;;
          static) apk add build-base linux-headers openssl-dev openssl-libs-static zlib-dev \
                 zlib-static bzip2-dev bzip2-static perl file patch tar ;;
          esac
      - uses: actions/download-artifact@v4
        with: { name: dist }
      - name: Build the package and install it
        run: |
          tar xzf pcompress-HEAD.tar.gz
          v=$(sh pcompress-HEAD/packaging/prepare.sh pcompress-HEAD)
          mv pcompress-HEAD "pcompress-$v" && d="pcompress-$v"
          case ${{ matrix.kind }} in
          rpm) mkdir -p ~/rpmbuild/SOURCES && tar czf ~/rpmbuild/SOURCES/"$d".tar.gz "$d"
               rpmbuild -bb "$d/packaging/pcompress.spec"
               dnf -y install ~/rpmbuild/RPMS/*/pcompress-"$v"-*.rpm ;;
          deb) tar czf pcompress_"$v".orig.tar.gz "$d"
               (cd "$d" && dpkg-buildpackage -us -uc -b)
               apt-get install -yq ./libpcompress1_*.deb ./pcompress_*.deb ;;
          static) cd "$d" && ./config --portable --disable-wavpack && make -j"$(nproc)" &&
               make test-unit && make static && file buildtmp/pcompress-static | grep -q static &&
               install -m 755 buildtmp/pcompress-static /usr/local/bin/pcompress ;;
          esac
          pcompress -V
          printf 'package check\n' > /tmp/p.txt
          pcompress -c zstd -l3 /tmp/p.txt && pcompress -d /tmp/p.txt.pz /tmp/p.out && cmp /tmp/p.txt /tmp/p.out

  macos:
    name: "macOS ${{ matrix.arch }}"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, arch: arm64 }
          - { runner: macos-15-intel, arch: x86_64 }
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - name: Dependencies
        run: |
          brew install openssl@3 libomp autoconf automake libtool pkg-config
          echo "OPENSSL_PREFIX=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          omp=$(brew --prefix libomp)
          echo "CFLAGS=-Xpreprocessor -fopenmp -I$omp/include" >> "$GITHUB_ENV"
          echo "LDFLAGS=-L$omp/lib -lomp" >> "$GITHUB_ENV"
      - name: Build and test
        run: sh ci/build-test.sh full

  windows:
    # MSYS2 with a MinGW-w64 clang toolchain: x86_64 (CLANG64) and aarch64
    # (CLANGARM64). ci/build-test.sh runs ./config, make and the tests; the
    # tests that cannot pass on Windows skip themselves with a reason.
    name: "Windows ${{ matrix.arch }} (MSYS2 ${{ matrix.sys }})"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: windows-latest, arch: x86_64, sys: CLANG64, env: clang-x86_64 }
          - { runner: windows-11-arm, arch: aarch64, sys: CLANGARM64, env: clang-aarch64 }
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: No CRLF in the checkout (shell scripts, test data)
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.sys }}
          update: false
          install: >-
            make autotools patch diffutils perl
          pacboy: >-
            clang:p llvm-openmp:p openssl:p zlib:p bzip2:p pkgconf:p
      - name: Build and test
        env: { CC: clang, CXX: clang++ }
        run: sh ci/build-test.sh quick
      - name: Binary I/O (CR, LF, CRLF, ^Z, NUL) round-trips in file and pipe mode
        run: |
          printf 'a\r\nb\nc\r\032d\000e\r\n\n\r' > crlf.bin
          head -c 3000000 /dev/urandom >> crlf.bin
          ./pcompress -c zstd -l3 crlf.bin && ./pcompress -d crlf.bin.pz crlf.out && cmp crlf.bin crlf.out
          ./pcompress -p -c lz4 -l1 < crlf.bin > crlf.p.pz && ./pcompress -d -p < crlf.p.pz > crlf.p.out
          cmp crlf.bin crlf.p.out
          mkdir -p arc/sub && cp crlf.bin arc/sub/ && printf 'x\r\n' > arc/t.txt
          ./pcompress -a -c zstd -l6 arc arc && mkdir out && ./pcompress -d arc.pz out
          cmp crlf.bin out/arc/sub/crlf.bin && cmp arc/t.txt out/arc/t.txt

  sanitizers:
    name: "ASan + UBSan"
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - name: Dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends \
            build-essential clang libomp-dev libssl-dev zlib1g-dev libbz2-dev \
            autoconf automake libtool pkg-config
      - name: Build and test under sanitizers
        env: { CC: clang, CXX: clang++, PCOMPRESS_SANITIZE: "1" }
        run: sh ci/build-test.sh quick

  abi:
    name: "Public API: ABI check and install"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - name: Dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends \
            build-essential libomp-dev libssl-dev zlib1g-dev libbz2-dev \
            autoconf automake libtool pkg-config abigail-tools
      - name: Build with debug info
        run: CFLAGS=-g ./config --disable-wavpack --prefix=/usr && make -j"$(nproc)"
      - name: ABI unchanged against abi/libpcompress.abi
        run: make abi-check
      - name: Only the public API is exported
        run: |
          nm -D --defined-only libpcompress.so.1 | awk '{print $3}' | grep -v '^PCOMPRESS_1$' \
            | sed 's/@.*//' | sort > exported.txt
          sed -n '/global:/,/local:/p' libpcompress.map | grep -v 'global:\|local:\|/\*' \
            | tr ';' '\n' | tr -d ' \t' | sed '/^$/d' | sort > listed.txt
          diff -u listed.txt exported.txt
      - name: Install, then build and run examples/pzcat.c via pkg-config
        run: |
          make install DESTDIR="$PWD/inst"
          export PKG_CONFIG_SYSROOT_DIR="$PWD/inst" PKG_CONFIG_LIBDIR="$PWD/inst/usr/lib/pkgconfig"
          cc $(pkg-config --cflags libpcompress) examples/pzcat.c -o pzcat \
            $(pkg-config --libs libpcompress) -Wl,-rpath,"$PWD/inst/usr/lib"
          ./pzcat -c < README.md > r.pz && ./pzcat < r.pz | cmp - README.md
          inst/usr/bin/pcompress -d r.pz r.out && cmp r.out README.md
      - name: examples/pzstore.c (chunker, ids, sealed objects, index); second put stores nothing
        run: |
          export PKG_CONFIG_SYSROOT_DIR="$PWD/inst" PKG_CONFIG_LIBDIR="$PWD/inst/usr/lib/pkgconfig"
          cc $(pkg-config --cflags libpcompress) examples/pzstore.c -o pzstore \
            $(pkg-config --libs libpcompress) -Wl,-rpath,"$PWD/inst/usr/lib"
          head -c 32 /dev/urandom > key; cat *.c *.md > in
          ./pzstore put st key in > m1 && ./pzstore put st key in > m2 2> second.log
          cmp m1 m2 && grep -q '^pzstore: 0 chunks stored' second.log
          ./pzstore get st key < m1 | cmp - in
      - name: examples/backup (snapshots, manifests, key file, prune, single-file restore)
        run: |
          export PKG_CONFIG_SYSROOT_DIR="$PWD/inst" PKG_CONFIG_LIBDIR="$PWD/inst/usr/lib/pkgconfig"
          cc -Wall -Wextra $(pkg-config --cflags libpcompress) examples/backup/pcbackup.c -o pcbackup \
            $(pkg-config --libs libpcompress) -Wl,-rpath,"$PWD/inst/usr/lib"
          sh examples/backup/test.sh "$PWD/pcbackup"

  nix:
    name: "Nix package (${{ matrix.runner }})"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: nix build (gcc) and nix build (clang); both run the tests
        run: nix build -L .#default .#pcompress-clang
      - name: nix flake check
        run: nix flake check -L

# GitHub Actions CI for pcompress.
#
# Every job runs the same recipe as the Codeberg CI: ci/build-test.sh.
# Linux (glibc, gcc + clang, x86_64 + arm64), macOS (Apple Silicon + Intel),
# sanitizers, and the Nix package build (which runs the test suite too).

name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux:
    name: "Linux ${{ matrix.arch }} / ${{ matrix.cc }}"
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-24.04, arch: x86_64, cc: gcc, cxx: g++ }
          - { runner: ubuntu-24.04, arch: x86_64, cc: clang, cxx: clang++ }
          - { runner: ubuntu-22.04, arch: x86_64, cc: gcc, cxx: g++ }
          - { runner: ubuntu-24.04-arm, arch: arm64, cc: gcc, cxx: g++ }
          - { runner: ubuntu-24.04-arm, arch: arm64, cc: clang, cxx: clang++ }
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - name: Dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends \
            build-essential clang libomp-dev libssl-dev zlib1g-dev libbz2-dev \
            autoconf automake libtool pkg-config yasm
      - name: Build and test
        env: { CC: "${{ matrix.cc }}", CXX: "${{ matrix.cxx }}" }
        run: sh ci/build-test.sh full

  macos:
    name: "macOS ${{ matrix.arch }}"
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, arch: arm64 }
          - { runner: macos-15-intel, arch: x86_64 }
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - name: Dependencies
        run: |
          brew install openssl@3 libomp autoconf automake libtool pkg-config
          echo "OPENSSL_PREFIX=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          omp=$(brew --prefix libomp)
          echo "CFLAGS=-Xpreprocessor -fopenmp -I$omp/include" >> "$GITHUB_ENV"
          echo "LDFLAGS=-L$omp/lib -lomp" >> "$GITHUB_ENV"
      - name: Build and test
        run: sh ci/build-test.sh full

  sanitizers:
    name: "ASan + UBSan"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - name: Dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends \
            build-essential clang libomp-dev libssl-dev zlib1g-dev libbz2-dev \
            autoconf automake libtool pkg-config
      - name: Build and test under sanitizers
        env: { CC: clang, CXX: clang++, PCOMPRESS_SANITIZE: "1" }
        run: sh ci/build-test.sh quick

  abi:
    name: "Public API: ABI check and install"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - name: Dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends \
            build-essential libomp-dev libssl-dev zlib1g-dev libbz2-dev \
            autoconf automake libtool pkg-config abigail-tools
      - name: Build with debug info
        run: CFLAGS=-g ./config --disable-wavpack --prefix=/usr && make -j"$(nproc)"
      - name: ABI unchanged against abi/libpcompress.abi
        run: make abi-check
      - name: Only the public API is exported
        run: |
          nm -D --defined-only libpcompress.so.1 | awk '{print $3}' | grep -v '^PCOMPRESS_1$' \
            | sed 's/@.*//' | sort > exported.txt
          sed -n '/global:/,/local:/p' libpcompress.map | grep -v 'global:\|local:\|/\*' \
            | tr ';' '\n' | tr -d ' \t' | sed '/^$/d' | sort > listed.txt
          diff -u listed.txt exported.txt
      - name: Install, then build and run examples/pzcat.c via pkg-config
        run: |
          make install DESTDIR="$PWD/inst"
          export PKG_CONFIG_SYSROOT_DIR="$PWD/inst" PKG_CONFIG_LIBDIR="$PWD/inst/usr/lib/pkgconfig"
          cc $(pkg-config --cflags libpcompress) examples/pzcat.c -o pzcat \
            $(pkg-config --libs libpcompress) -Wl,-rpath,"$PWD/inst/usr/lib"
          ./pzcat -c < README.md > r.pz && ./pzcat < r.pz | cmp - README.md
          inst/usr/bin/pcompress -d r.pz r.out && cmp r.out README.md

  nix:
    name: "Nix package (${{ matrix.runner }})"
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: nix build (gcc) and nix build (clang); both run the tests
        run: nix build -L .#default .#pcompress-clang
      - name: nix flake check
        run: nix flake check -L

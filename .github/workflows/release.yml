# Release: on a v* tag, build and test on every platform, then publish
# a GitHub release with
#   - pcompress-<ver>.tar.gz: full source including the bundled submodules
#     (GitHub's automatic archives omit them, so they cannot be built)
#   - pcompress-<ver>-<os>-<arch>.tar.gz: binary, library and man page
#   - pcompress-<ver>-linux-<arch>-static: one static (musl) binary
#   - .rpm (Fedora) and .deb (Debian) packages from packaging/
#   - SHA256SUMS, and a signed build-provenance attestation for every file
#     (verify: gh attestation verify <file> -R gburd/pcompress)
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build"
        required: true

permissions:
  contents: write
  id-token: write      # Sigstore signing of the provenance attestation
  attestations: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  source:
    name: Source tarball
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive, ref: "${{ env.TAG }}", fetch-depth: 0 }
      # ci/make-dist.sh generates libarchive's configure; do not rely on
      # the runner image happening to ship autotools.
      - run: sudo apt-get install -yq --no-install-recommends autoconf automake libtool pkg-config
      - name: Create tarball with submodules
        run: sh ci/make-dist.sh "$TAG" . < /dev/null
      - uses: actions/upload-artifact@v4
        with: { name: source, path: "pcompress-*.tar.gz" }

  binaries:
    name: "Binary ${{ matrix.name }}"
    needs: source
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: linux-x86_64, runner: ubuntu-22.04 }
          - { name: linux-arm64, runner: ubuntu-24.04-arm }
          - { name: macos-arm64, runner: macos-15 }
          - { name: macos-x86_64, runner: macos-15-intel }
    steps:
      - uses: actions/download-artifact@v4
        with: { name: source }
      - name: Unpack the released source (what users build)
        run: tar xzf pcompress-*.tar.gz && mv pcompress-*/ src
      - name: Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends build-essential \
            libssl-dev zlib1g-dev libbz2-dev autoconf automake libtool pkg-config yasm
      - name: Dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3 libomp autoconf automake libtool pkg-config
          echo "OPENSSL_PREFIX=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          omp=$(brew --prefix libomp)
          echo "CFLAGS=-Xpreprocessor -fopenmp -I$omp/include" >> "$GITHUB_ENV"
          echo "LDFLAGS=-L$omp/lib -lomp" >> "$GITHUB_ENV"
      - name: Build and test (portable)
        run: sh src/ci/build-test.sh full --portable --prefix=/usr/local
      - name: Package
        run: |
          v=${TAG#v}; d=pcompress-$v-${{ matrix.name }}
          make -C src install DESTDIR="$PWD/stage" PREFIX=/usr/local
          mkdir -p $d && cp -R stage/usr/local/. $d/
          cp src/README.md src/COPYING src/COPYING.LESSER $d/
          # The unpacked tarball must run from anywhere, with no env vars.
          mv $d /tmp/$d && env -u LD_LIBRARY_PATH -u DYLD_LIBRARY_PATH /tmp/$d/bin/pcompress -V
          printf 'relocatable binary check\n' > /tmp/rel.txt
          /tmp/$d/bin/pcompress -c zstd -l3 /tmp/rel.txt && /tmp/$d/bin/pcompress -d /tmp/rel.txt.pz /tmp/rel.out
          cmp /tmp/rel.txt /tmp/rel.out && mv /tmp/$d $d
          tar czf $d.tar.gz $d
      - uses: actions/upload-artifact@v4
        with: { name: "bin-${{ matrix.name }}", path: "pcompress-*-${{ matrix.name }}.tar.gz" }

  static:
    # Fully static only with musl: glibc's static NSS and dlopen do not work.
    # Alpine runs under docker from the host runner: GitHub's JavaScript
    # actions (download/upload-artifact) cannot run inside an Alpine job
    # container on arm64 runners.
    name: "Static binary linux-${{ matrix.arch }}"
    needs: source
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - uses: actions/download-artifact@v4
        with: { name: source }
      - name: Build, test, link statically (Alpine)
        env: { ARCH: "${{ matrix.arch }}" }
        run: |
          cat > static.sh <<'EOF'
          set -eu
          apk add build-base linux-headers openssl-dev openssl-libs-static zlib-dev \
            zlib-static bzip2-dev bzip2-static perl file patch tar
          tar xzf pcompress-*.tar.gz && cd pcompress-*/
          ./config --portable --disable-wavpack && make -j"$(nproc)" && make check && make static
          file buildtmp/pcompress-static | grep -q 'static'
          printf 'static binary check\n' > /tmp/s.txt
          buildtmp/pcompress-static -c zstd -l3 /tmp/s.txt && buildtmp/pcompress-static -d /tmp/s.txt.pz /tmp/s.out
          cmp /tmp/s.txt /tmp/s.out
          cp buildtmp/pcompress-static "../pcompress-${TAG#v}-linux-${ARCH}-static"
          EOF
          docker run --rm -e TAG -e ARCH -v "$PWD:/w" -w /w alpine:latest sh static.sh
      - uses: actions/upload-artifact@v4
        with: { name: "static-${{ matrix.arch }}", path: "pcompress-*-static" }

  rpm:
    name: "RPM ${{ matrix.arch }}"
    needs: source
    runs-on: ${{ matrix.runner }}
    container: { image: "fedora:latest" }
    strategy:
      fail-fast: true
      matrix:
        include:
          - { arch: x86_64, runner: ubuntu-24.04 }
          - { arch: aarch64, runner: ubuntu-24.04-arm }
    steps:
      - name: Dependencies
        run: |
          dnf -y install rpm-build gcc gcc-c++ make openssl-devel zlib-devel bzip2-devel \
            perl which diffutils findutils file patch tar gzip
      - uses: actions/download-artifact@v4
        with: { name: source }
      - name: rpmbuild (runs make check)
        run: |
          tar xzf pcompress-*.tar.gz && for d in pcompress-*/; do break; done
          v=$(sh "$d/packaging/prepare.sh" "$d")
          mkdir -p ~/rpmbuild/SOURCES && cp pcompress-*.tar.gz ~/rpmbuild/SOURCES/
          rpmbuild -bb "$d/packaging/pcompress.spec"
          dnf -y install ~/rpmbuild/RPMS/*/pcompress-"$v"-*.rpm && pcompress -V
          cp ~/rpmbuild/RPMS/*/*.rpm .
      - uses: actions/upload-artifact@v4
        with: { name: "rpm-${{ matrix.arch }}", path: "*.rpm" }

  deb:
    name: "Debian package ${{ matrix.arch }}"
    needs: source
    runs-on: ${{ matrix.runner }}
    container: { image: "debian:stable" }
    strategy:
      fail-fast: true
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    steps:
      - name: Dependencies
        run: |
          apt-get update -q
          DEBIAN_FRONTEND=noninteractive apt-get install -yq --no-install-recommends \
            build-essential debhelper libssl-dev zlib1g-dev libbz2-dev perl file patch
      - uses: actions/download-artifact@v4
        with: { name: source }
      - name: dpkg-buildpackage (runs make check)
        run: |
          tar xzf pcompress-*.tar.gz && for d in pcompress-*/; do break; done
          v=$(sh "$d/packaging/prepare.sh" "$d")
          cp pcompress-"$v".tar.gz pcompress_"$v".orig.tar.gz
          (cd "$d" && dpkg-buildpackage -us -uc -b)
          apt-get install -yq ./libpcompress1_*.deb ./pcompress_*.deb && pcompress -V
          find . -maxdepth 1 -name '*dbgsym*' -delete
      - uses: actions/upload-artifact@v4
        with: { name: "deb-${{ matrix.arch }}", path: "*.deb" }

  publish:
    name: Publish release
    needs: [source, binaries, static, rpm, deb]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Checksums
        run: cd dist && sha256sum -- * | tee SHA256SUMS
      - name: Signed build provenance for every file
        uses: actions/attest-build-provenance@v2
        with: { subject-path: "dist/*" }
      - name: Create release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --verify-tag \
              --title "pcompress ${TAG#v}" --generate-notes
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber dist/*

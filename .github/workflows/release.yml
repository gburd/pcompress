# Release: on a v* tag, build and test on every platform, then publish
# a GitHub release with
#   - pcompress-<ver>.tar.gz: full source including the bundled submodules
#     (GitHub's automatic archives omit them, so they cannot be built)
#   - pcompress-<ver>-<os>-<arch>.tar.gz: binary, library and man page
#   - SHA256SUMS
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  source:
    name: Source tarball
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive, ref: "${{ env.TAG }}", fetch-depth: 0 }
      - name: Create tarball with submodules
        run: sh ci/make-dist.sh "$TAG" . < /dev/null
      - uses: actions/upload-artifact@v4
        with: { name: source, path: "pcompress-*.tar.gz" }

  binaries:
    name: "Binary ${{ matrix.name }}"
    needs: source
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: linux-x86_64, runner: ubuntu-22.04 }
          - { name: linux-arm64, runner: ubuntu-24.04-arm }
          - { name: macos-arm64, runner: macos-15 }
          - { name: macos-x86_64, runner: macos-15-intel }
    steps:
      - uses: actions/download-artifact@v4
        with: { name: source }
      - name: Unpack the released source (what users build)
        run: tar xzf pcompress-*.tar.gz && mv pcompress-*/ src
      - name: Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends build-essential \
            libssl-dev zlib1g-dev libbz2-dev autoconf automake libtool pkg-config yasm
      - name: Dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install openssl@3 libomp autoconf automake libtool pkg-config
          echo "OPENSSL_PREFIX=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          omp=$(brew --prefix libomp)
          echo "CFLAGS=-Xpreprocessor -fopenmp -I$omp/include" >> "$GITHUB_ENV"
          echo "LDFLAGS=-L$omp/lib -lomp" >> "$GITHUB_ENV"
      - name: Build and test (portable)
        run: sh src/ci/build-test.sh full --portable --prefix=/usr/local
      - name: Package
        run: |
          v=${TAG#v}; d=pcompress-$v-${{ matrix.name }}
          make -C src install DESTDIR="$PWD/stage" PREFIX=/usr/local
          mkdir -p $d && cp -R stage/usr/local/. $d/
          cp src/README.md src/COPYING src/COPYING.LESSER $d/
          tar czf $d.tar.gz $d
      - uses: actions/upload-artifact@v4
        with: { name: "bin-${{ matrix.name }}", path: "pcompress-*-${{ matrix.name }}.tar.gz" }

  publish:
    name: Publish release
    needs: [source, binaries]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Checksums
        run: cd dist && sha256sum *.tar.gz | tee SHA256SUMS
      - name: Create release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --verify-tag \
              --title "pcompress ${TAG#v}" --generate-notes
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" --clobber dist/*

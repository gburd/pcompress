name: Flake hunt

# Manual: repeat the whole feature matrix on hosted runners to measure the
# intermittent "Truncated tar archive" extraction failure (docs/PLATFORMS.md).
# libarchive=old builds with the 4.1.0 libarchive (3.7.9) and its patch.
on:
  workflow_dispatch:
    inputs:
      ref: { description: "commit or tag to test", required: true, default: "master" }
      rounds: { description: "feature-matrix runs per job", required: true, default: "15" }
      libarchive: { description: "new (as pinned) or old (3.7.9)", required: true, default: "new" }

permissions:
  contents: read

jobs:
  hunt:
    name: "${{ matrix.runner }} ${{ matrix.cc }} #${{ matrix.shard }} (libarchive ${{ inputs.libarchive }})"
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        cc: [gcc]
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive, ref: "${{ inputs.ref }}", fetch-depth: 0 }
      - name: Use libarchive 3.7.9
        if: ${{ inputs.libarchive == 'old' }}
        run: |
          git -C archive/libarchive fetch -q origin 8a7a9cc527fd1d6d8664315d3bed47c4259479cc
          git -C archive/libarchive checkout -q 8a7a9cc527fd1d6d8664315d3bed47c4259479cc
          git show v4.1.0:archive/patches/pcompress_libarchive.patch > archive/patches/pcompress_libarchive.patch
      - run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends build-essential libssl-dev \
            zlib1g-dev libbz2-dev autoconf automake libtool pkg-config
      - run: ./config --disable-wavpack && make -j"$(nproc)"
      - name: Repeat the feature matrix
        run: |
          set +e
          f=0
          for i in $(seq 1 ${{ inputs.rounds }}); do
            sh test/feature_matrix.sh "$PWD/pcompress" "/tmp/fm$i" > "/tmp/fm$i.log" 2>&1
            tail -n 1 "/tmp/fm$i.log"
            if grep -q '^FAIL' "/tmp/fm$i.log"; then
              f=$((f+1)); grep -A30 '^FAIL' "/tmp/fm$i.log" | head -60
            fi
          done
          echo "runs with a failure: $f of ${{ inputs.rounds }}"

# Nightly: the long-running checks that are too slow for every push.
name: Nightly

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read   # bench: find the previous run's artifact

jobs:
  long:
    name: "Full matrix + legacy suite"
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - name: Dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends \
            build-essential libssl-dev zlib1g-dev libbz2-dev \
            autoconf automake libtool pkg-config yasm valgrind
      # --portable: valgrind cannot run AVX-512, and some runners have it
      # (a host-tuned build died with SIGILL on those, 2 nights in 5).
      - name: Build and quick tests
        run: sh ci/build-test.sh quick --portable
      - name: Full feature matrix (every level)
        run: CORPUS="$PWD" sh test/feature_matrix.sh "$PWD/pcompress" /tmp/pc-matrix
      - name: Legacy t1-t9 suite
        run: cd test && sh run_all_tests.sh legacy
      - name: Valgrind round trip
        run: |
          head -c 4000000 /dev/urandom > /tmp/v.dat; cat README.md DESIGN.md >> /tmp/v.dat
          for a in zstd lzma lz4 adapt2; do
            rm -f /tmp/v.dat.pz /tmp/v.out
            valgrind -q --error-exitcode=99 ./buildtmp/pcompress -c $a -l6 -s 1m /tmp/v.dat
            valgrind -q --error-exitcode=99 ./buildtmp/pcompress -d /tmp/v.dat.pz /tmp/v.out
            cmp /tmp/v.dat /tmp/v.out
          done
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}

  coverage:
    # Line and branch coverage of pcompress's own code (make coverage).
    name: "Coverage (gcov)"
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - name: Dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends \
            build-essential libomp-dev libssl-dev zlib1g-dev libbz2-dev \
            autoconf automake libtool pkg-config lcov
      - name: Build with gcov
        run: ./config --disable-wavpack --enable-coverage && make -j"$(nproc)"
      - name: make coverage
        run: make coverage | tee coverage.txt
      - name: Summary
        run: |
          {
            echo '### Coverage of pcompress code (third-party trees excluded)'
            echo '```'
            sed -n '/Summary coverage rate/,$p' coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with: { name: coverage, path: coverage.info }

  fuzz:
    # libFuzzer with ASan over the decoders that take untrusted bytes:
    # chunk objects and key files (fuzz_chunk), manifests (fuzz_manifest),
    # raw codec input (fuzz_decompress), plus fuzz_compress and fuzz_crc.
    name: "Fuzz (libFuzzer + ASan)"
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - name: Dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends \
            build-essential clang libomp-dev libssl-dev zlib1g-dev libbz2-dev \
            autoconf automake libtool pkg-config
      # The library itself is built with fuzzer coverage, so the harnesses
      # see inside the decoders and not only their own code.
      - name: Build
        env:
          CC: clang
          CXX: clang++
          CFLAGS: -fsanitize=fuzzer-no-link,address -g
          LDFLAGS: -fsanitize=address
          ASAN_OPTIONS: detect_leaks=0
        run: |
          ./config --disable-wavpack && make -j"$(nproc)"
          make fuzz-build
      - name: Fuzz each target for 10 minutes
        env: { FUZZ_SECONDS: "600", ASAN_OPTIONS: "detect_leaks=0" }
        run: cd test && sh run_all_tests.sh fuzz
      - name: Keep crashing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: |
            test/crash-*
            test/oom-*
            test/timeout-*
          if-no-files-found: ignore

  bench:
    # Fixed-corpus benchmark (ci/bench.py): enwik8 with the main codecs,
    # and bench_chunk, compared with the last successful nightly's result.
    # A worse ratio fails the job; slower MB/s only warns, since shared
    # runners vary 10 to 20% between runs.
    name: "Benchmark tracking"
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - name: Dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends \
            build-essential libomp-dev libssl-dev zlib1g-dev libbz2-dev \
            autoconf automake libtool pkg-config
      - uses: actions/cache@v4
        with: { path: corpus, key: enwik8-547994d9 }
      - name: Corpus (enwik8, pinned by sha256)
        run: |
          mkdir -p corpus
          if [ ! -f corpus/enwik8.zip ]; then
            curl -sSfL --retry 3 -o corpus/enwik8.zip https://mattmahoney.net/dc/enwik8.zip
          fi
          echo "547994d9980ebed1288380d652999f38a14fe291a6247c157c3d33d4932534bc  corpus/enwik8.zip" \
            | sha256sum -c -
          unzip -o -q corpus/enwik8.zip -d corpus
      # --portable: runners differ in CPU; a host-tuned build would make
      # the numbers depend on which one the job landed on.
      - name: Build
        run: ./config --disable-wavpack --portable && make -j"$(nproc)" && make buildtmp/bench_chunk
      - name: Measure
        run: python3 ci/bench.py run ./pcompress corpus/enwik8 buildtmp/bench_chunk bench.json
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}
      - uses: actions/upload-artifact@v4
        with: { name: bench, path: bench.json }
      - name: Compare with the previous nightly
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          prev=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/nightly.yml/runs?status=success&branch=$GITHUB_REF_NAME&per_page=10" \
            --jq "[.workflow_runs[] | select(.id != $GITHUB_RUN_ID)][0].id // empty")
          if [ -z "$prev" ] || ! gh run download "$prev" -n bench -D prev 2>/dev/null; then
            echo "No earlier bench result: nothing to compare."
            exit 0
          fi
          python3 ci/bench.py compare prev/bench.json bench.json | tee compare.txt
          { echo '### Benchmark vs previous nightly'; echo '```'; cat compare.txt; echo '```'; } \
            >> "$GITHUB_STEP_SUMMARY"


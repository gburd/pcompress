# Nightly: the long-running checks that are too slow for every push.
name: Nightly

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  long:
    name: "Full matrix + legacy suite"
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - name: Dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends \
            build-essential libssl-dev zlib1g-dev libbz2-dev \
            autoconf automake libtool pkg-config yasm valgrind
      # --portable: valgrind cannot run AVX-512, and some runners have it
      # (a host-tuned build died with SIGILL on those, 2 nights in 5).
      - name: Build and quick tests
        run: sh ci/build-test.sh quick --portable
      - name: Full feature matrix (every level)
        run: CORPUS="$PWD" sh test/feature_matrix.sh "$PWD/pcompress" /tmp/pc-matrix
      - name: Legacy t1-t9 suite
        run: cd test && sh run_all_tests.sh legacy
      - name: Valgrind round trip
        run: |
          head -c 4000000 /dev/urandom > /tmp/v.dat; cat README.md DESIGN.md >> /tmp/v.dat
          for a in zstd lzma lz4 adapt2; do
            rm -f /tmp/v.dat.pz /tmp/v.out
            valgrind -q --error-exitcode=99 ./buildtmp/pcompress -c $a -l6 -s 1m /tmp/v.dat
            valgrind -q --error-exitcode=99 ./buildtmp/pcompress -d /tmp/v.dat.pz /tmp/v.out
            cmp /tmp/v.dat /tmp/v.out
          done
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}

  coverage:
    # Line and branch coverage of pcompress's own code (make coverage).
    name: "Coverage (gcov)"
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - name: Dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends \
            build-essential libomp-dev libssl-dev zlib1g-dev libbz2-dev \
            autoconf automake libtool pkg-config lcov
      - name: Build with gcov
        run: ./config --disable-wavpack --enable-coverage && make -j"$(nproc)"
      - name: make coverage
        run: make coverage | tee coverage.txt
      - name: Summary
        run: |
          {
            echo '### Coverage of pcompress code (third-party trees excluded)'
            echo '```'
            sed -n '/Summary coverage rate/,$p' coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with: { name: coverage, path: coverage.info }

# Nightly: the long-running checks that are too slow for every push.
name: Nightly

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  long:
    name: "Full matrix + legacy suite"
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - name: Dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends \
            build-essential libssl-dev zlib1g-dev libbz2-dev \
            autoconf automake libtool pkg-config yasm valgrind
      # --portable: valgrind cannot run AVX-512, and some runners have it
      # (a host-tuned build died with SIGILL on those, 2 nights in 5).
      - name: Build and quick tests
        run: sh ci/build-test.sh quick --portable
      - name: Full feature matrix (every level)
        run: CORPUS="$PWD" sh test/feature_matrix.sh "$PWD/pcompress" /tmp/pc-matrix
      - name: Legacy t1-t9 suite
        run: cd test && sh run_all_tests.sh legacy
      - name: Valgrind round trip
        run: |
          head -c 4000000 /dev/urandom > /tmp/v.dat; cat README.md DESIGN.md >> /tmp/v.dat
          for a in zstd lzma lz4 adapt2; do
            rm -f /tmp/v.dat.pz /tmp/v.out
            valgrind -q --error-exitcode=99 ./buildtmp/pcompress -c $a -l6 -s 1m /tmp/v.dat
            valgrind -q --error-exitcode=99 ./buildtmp/pcompress -d /tmp/v.dat.pz /tmp/v.out
            cmp /tmp/v.dat /tmp/v.out
          done
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}

  difffuzz:
    # ci/difffuzz.sh: this build against the 4.4.0 release, both ways,
    # and the chunk/manifest/index formats against the Python model.
    name: "Cross-version differential fuzz (vs 4.4.0)"
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - name: Dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends \
            build-essential libomp-dev libssl-dev zlib1g-dev libbz2-dev \
            autoconf automake libtool pkg-config python3
      - name: Build this tree
        run: ./config --disable-wavpack && make -j"$(nproc)"
      - name: Build 4.4.0 from its release tarball
        run: |
          curl -fsSLo /tmp/old.tar.gz \
            https://github.com/gburd/pcompress/releases/download/v4.4.0/pcompress-4.4.0.tar.gz
          echo "36d27e621aa2be5dd7cb13b12cdf6c4b840c09f0f841ca5afc1d5c00da90853d  /tmp/old.tar.gz" |
            sha256sum -c
          mkdir -p /tmp/old && tar -C /tmp/old -xzf /tmp/old.tar.gz
          cd /tmp/old/pcompress-4.4.0 && ./config --disable-wavpack && make -j"$(nproc)"
      - name: 300 seeds
        run: sh ci/difffuzz.sh . /tmp/old/pcompress-4.4.0 300

  coverage:
    # Line and branch coverage of pcompress's own code (make coverage).
    name: "Coverage (gcov)"
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - name: Dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends \
            build-essential libomp-dev libssl-dev zlib1g-dev libbz2-dev \
            autoconf automake libtool pkg-config lcov
      - name: Build with gcov
        run: ./config --disable-wavpack --enable-coverage && make -j"$(nproc)"
      - name: make coverage
        run: make coverage | tee coverage.txt
      - name: Summary
        run: |
          {
            echo '### Coverage of pcompress code (third-party trees excluded)'
            echo '```'
            sed -n '/Summary coverage rate/,$p' coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with: { name: coverage, path: coverage.info }

  fuzz:
    # libFuzzer with ASan over the decoders that take untrusted bytes:
    # chunk objects and key files (fuzz_chunk), manifests (fuzz_manifest),
    # raw codec input (fuzz_decompress), plus fuzz_compress and fuzz_crc.
    name: "Fuzz (libFuzzer + ASan)"
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - name: Dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq --no-install-recommends \
            build-essential clang libomp-dev libssl-dev zlib1g-dev libbz2-dev \
            autoconf automake libtool pkg-config
      # The library itself is built with fuzzer coverage, so the harnesses
      # see inside the decoders and not only their own code.
      - name: Build
        env:
          CC: clang
          CXX: clang++
          CFLAGS: -fsanitize=fuzzer-no-link,address -g
          LDFLAGS: -fsanitize=address
          ASAN_OPTIONS: detect_leaks=0
        run: |
          ./config --disable-wavpack && make -j"$(nproc)"
          make fuzz-build
      - name: Fuzz each target for 10 minutes
        env: { FUZZ_SECONDS: "600", ASAN_OPTIONS: "detect_leaks=0" }
        run: cd test && sh run_all_tests.sh fuzz
      - name: Keep crashing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: |
            test/crash-*
            test/oom-*
            test/timeout-*
          if-no-files-found: ignore

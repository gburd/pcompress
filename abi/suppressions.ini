# struct pc_ctx is opaque to programs (include/pcompress/pcompress.h has only
# "typedef struct pc_ctx pc_ctx_t"): they never see its size or members, so
# changes inside it are not ABI changes. Same for the chunker, index and
# manifest state. (pc_entry_t is public: its layout is ABI.)
[suppress_type]
  name = pc_ctx
[suppress_type]
  name = pc_chunker
[suppress_type]
  name = pc_index
[suppress_type]
  name = pc_manifest
# pc_entry_t is public, but callers pass its size to the _sz functions,
# so members appended at its end are compatible (old programs pass the old
# size). Only appending is allowed; any other change still fails.
[suppress_type]
  name = pc_entry_t
  has_data_member_inserted_at = end

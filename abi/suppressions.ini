# struct pc_ctx is opaque to programs (include/pcompress/pcompress.h has only
# "typedef struct pc_ctx pc_ctx_t"): they never see its size or members, so
# changes inside it are not ABI changes. Same for the chunker, index and
# manifest state. (pc_entry_t is public: its layout is ABI.)
[suppress_type]
  name = pc_ctx
[suppress_type]
  name = pc_chunker
[suppress_type]
  name = pc_index
[suppress_type]
  name = pc_manifest
